name: ansi_modifier

description: Simplifies styling strings for colour terminal output by adding,
  replacing, or removing ANSI modifiers. Provides support for moving the current
  cursor position.

version: 0.1.5

homepage: https://github.com/simphotonics/ansi_modifier

topics:
  - ansi
  - terminal
  - console
  - color
  - cursor-position

environment:
  sdk: '^3.9.0'

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
