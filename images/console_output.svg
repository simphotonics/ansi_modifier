<svg xmlns="http://www.w3.org/2000/svg" width="688" height="70" viewBox="0 0 688 70" role="img" aria-label="console2svg output">
<style>
.c2.c { font-family: "JetBrains Mono","Cascadia Mono","Segoe UI Mono","Noto Sans Mono","SFMono-Regular",Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace; font-size: 14px; }
.c2 text { dominant-baseline: alphabetic; }
.c2 .q { shape-rendering: crispEdges; }
.c2 .w { white-space: pre; }
.c2 .aa{fill:#d4d4d4}
.c2 .ab{fill:#FF5B5B;font-weight:bold}
.c2 .ac{fill:#23d18b;font-style:italic}
</style><rect width="688" height="70" fill="#1e1e1e"/>
<g class="c2 c"><rect x="8" y="8" width="672" height="18" fill="#1e1e1e"/>
<text class="aa" x="8" y="22">$ dart example/bin/color_example.dart</text></g>
<g class="c2 c" transform="translate(8 26)">
<rect width="672" height="36" fill="#1e1e1e"/>
<text class="aa" y="14" textLength="25.2">The</text>
<text class="ab" x="33.6" y="14" textLength="25.2">red</text>
<text class="aa w" x="67.2" y="14" textLength="151.2">fox jumps over the</text>
<text class="ac" x="226.8" y="14" textLength="42">green</text>
<text class="aa" x="277.2" y="14" textLength="50.4">fence.</text>
</g>
</svg>